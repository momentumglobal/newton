name: Secret scan (gitleaks)

# N-293 (SEC-13): scans the FULL git history for committed secrets on every push
# and on demand. Separate from static.yml on purpose: a finding turns this run red
# and emails the owner, but never blocks a Pages deploy.
#
# Why not the packaged GitHub Action for gitleaks: it needs a licence key on
# organisation-owned repos. The open-source binary below does the same scan.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 = every commit. The default shallow checkout would scan
      # one commit and report a false clean.
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o gitleaks.tgz "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" checksums.txt | sed 's/  gitleaks_.*/  gitleaks.tgz/' | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      # --redact: this repo is public, so this log is public. Never print a matched
      # secret. No report file is written and nothing is uploaded, for the same reason.
      - name: Scan full history
        run: ./gitleaks git --redact --no-banner --verbose --exit-code 1 .