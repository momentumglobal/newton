# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Blocks deploy on a failing calc assertion (N-095), and on a timezone
  # dependence in any of three zones (N-134).
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      # N-134: three zones, covering the three distinct relationships to UTC.
      # tests/run.js FORCES TZ=Europe/London on line 11, so a bare `TZ=` prefix
      # is silently overwritten and would give three identical London runs
      # reporting a pass that proves nothing — NEWTON_TZ is the override that
      # actually works. Skips do not fail the build: run.js exits non-zero only
      # on failures, so the UTC run's legitimate 33/34 + 1 skip still passes.
      # Zones deliberately NOT added: Athens/Los Angeles/Tokyo behave identically
      # to those below (the midday-UTC convention absorbs any offset inside
      # ±11h), and Pacific/Auckland would pass despite the convention genuinely
      # breaking at exactly +12 — that gap needs an assertion, not a zone (N-136).
      - name: Test — Europe/London (site timezone, observes DST)
        run: node tests/run.js
      - name: Test — UTC (no DST offset; where CI containers live)
        run: NEWTON_TZ=UTC node tests/run.js
      - name: Test — America/New_York (behind UTC — the N-130 class)
        run: NEWTON_TZ=America/New_York node tests/run.js
      # N-210: catches the silent-stale-cache failure mode — js/ changes
      # deployed without a CONFIG.APP_BUILD bump give users up to 10 minutes
      # of stale reference data with no visible error. Compares the
      # APP_BUILD value (not just its presence) between the base commit and
      # HEAD, so a no-op reformat of the line still fails. Skips cleanly on
      # a brand-new branch or an unresolvable force-push base rather than
      # false-failing an unrelated push.
      - name: Guard — APP_BUILD bump when js/ changes
        run: |
          git fetch origin 'refs/tags/*:refs/tags/*' --force >/dev/null 2>&1 || true
          ZERO="0000000000000000000000000000000000000000"

          DEPLOYED=$(git rev-parse -q --verify refs/tags/last-deploy^{commit} 2>/dev/null || true)
          if [ -n "$DEPLOYED" ]; then
            BASE="$DEPLOYED"
            echo "Using last-deploy tag as base: $BASE"
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "$ZERO" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              echo "No base commit to compare against (no last-deploy tag yet, and new branch or unresolvable force-push) — skipping guard."
              exit 0
            fi
            echo "No last-deploy tag yet — falling back to previous-push base: $BASE"
          fi

          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}" -- js/)
          if [ -z "$CHANGED" ]; then
            echo "No js/ changes in this push — skipping guard."
            exit 0
          fi

          NEW=$(grep -oP "APP_BUILD:\s*'\K[^']+" js/config.js || echo "__MISSING__")
          if [ "$NEW" = "__MISSING__" ]; then
            echo "::error file=js/config.js::APP_BUILD stamp not found in js/config.js — it must always be present."
            exit 1
          fi

          OLD=$(git show "$BASE:js/config.js" 2>/dev/null | grep -oP "APP_BUILD:\s*'\K[^']+" || echo "__MISSING__")
          if [ "$OLD" = "__MISSING__" ]; then
            echo "js/config.js is new in this push (or had no APP_BUILD line before) — nothing to compare, skipping guard."
            exit 0
          fi

          if [ "$OLD" = "$NEW" ]; then
            echo "::error file=js/config.js::js/ changed but CONFIG.APP_BUILD in js/config.js was not bumped (still '$NEW'). Bump the APP_BUILD stamp (e.g. to today's date) before merging — see js/config.js line ~432."
            echo "Changed js/ files:"
            echo "$CHANGED"
            exit 1
          fi

          echo "APP_BUILD bumped ($OLD -> $NEW) for this js/ change — guard passed."

  # Single deploy job since we're just deploying
  deploy:
    needs: test
    # Job-level permissions REPLACE the top-level block for this job (they
    # don't merge) — pages/id-token must be repeated alongside the new
    # contents: write, or Pages deploy itself would lose permission.
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      # N-212: moves the "last known good" pointer the test job's APP_BUILD
      # guard diffs against. Only runs after a real deploy succeeds, so a
      # broken push can never move the baseline. Lightweight tag — no git
      # identity/commit needed — pushed with the checkout's default token.
      - name: Record last deployed commit
        if: success()
        run: |
          git tag -f last-deploy
          git push origin last-deploy --force
