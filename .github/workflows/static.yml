# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Blocks deploy on a failing calc assertion (N-095), and on a timezone
  # dependence in any of three zones (N-134).
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      # N-134: three zones, covering the three distinct relationships to UTC.
      # tests/run.js FORCES TZ=Europe/London on line 11, so a bare `TZ=` prefix
      # is silently overwritten and would give three identical London runs
      # reporting a pass that proves nothing — NEWTON_TZ is the override that
      # actually works. Skips do not fail the build: run.js exits non-zero only
      # on failures, so the UTC run's legitimate 33/34 + 1 skip still passes.
      # Zones deliberately NOT added: Athens/Los Angeles/Tokyo behave identically
      # to those below (the midday-UTC convention absorbs any offset inside
      # ±11h), and Pacific/Auckland would pass despite the convention genuinely
      # breaking at exactly +12 — that gap needs an assertion, not a zone (N-136).
      - name: Test — Europe/London (site timezone, observes DST)
        run: node tests/run.js
      - name: Test — UTC (no DST offset; where CI containers live)
        run: NEWTON_TZ=UTC node tests/run.js
      - name: Test — America/New_York (behind UTC — the N-130 class)
        run: NEWTON_TZ=America/New_York node tests/run.js

  # Single deploy job since we're just deploying
  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
