<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; connect-src 'self' https://graph.microsoft.com https://login.microsoftonline.com; img-src 'self' https://talentpoint.sharepoint.com data: blob:; font-src 'self' data:; frame-src 'self' https://login.microsoftonline.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'">
  <meta name="referrer" content="no-referrer">
  <script src="js/diag-buffer.js"></script>
  <script src="js/frame-guard.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Newton Mobile</title>
  <link rel="icon" type="image/png" href="momentum-symbol.png">

  <!-- PWA: installable home-screen app -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#090546">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Newton">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body>

  <!-- Login -->
  <div id="login-screen" style="display:none">
    <img id="login-watermark" src="mg-visual-swirl.webp" alt="">
    <img class="m-login-logo" src="momentum-symbol-and-name-global-white.png" alt="Momentum Global">
    <div class="m-login-card">
      <h1>Newton</h1>
      <p>Sign in with your Momentum Global account to continue.</p>
      <button class="btn-signin" data-act="signIn">Sign in with Microsoft</button>
    </div>
  </div>

  <!-- App shell -->
  <div id="app-shell">
    <div class="m-topbar" id="m-topbar">
      <div style="display:flex;align-items:center;gap:4px">
        <button class="m-back-btn" id="m-back-btn" data-act="mobileBack" style="display:none">&#8592;</button>
        <div>
          <div class="m-topbar-title" id="m-topbar-title">Newton</div>
          <div class="m-topbar-sub"   id="m-topbar-sub">Momentum Global</div>
        </div>
      </div>
      <div style="position:relative">
        <button class="m-switcher-btn" id="m-switcher-btn" data-act="mobileToggleSwitcher">
          <span id="m-switcher-label">Newton</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="m-switcher-menu" id="m-switcher-menu" style="display:none"></div>
      </div>
    </div>

    <div class="m-ptr" id="m-ptr" aria-hidden="true">
      <svg class="m-ptr-spinner" viewBox="0 0 24 24" fill="none" stroke="#0A0B44" stroke-width="2.5">
        <path d="M21 12a9 9 0 1 1-3-6.7"/>
        <polyline points="21 3 21 9 15 9"/>
      </svg>
    </div>

    <div id="m-main"></div>

    <nav class="m-bottom-nav" id="m-bottom-nav" style="display:none"></nav>

    <div class="m-desktop-link">
      <a data-act="mobileForceDesktop">Switch to desktop view</a>
    </div>
  </div>

  <!-- Bottom sheet (N-199) -->
  <div class="m-sheet-scrim" id="m-sheet-scrim"></div>
  <div class="m-sheet" id="m-sheet" role="dialog" aria-modal="true">
    <div class="m-sheet-header">
      <div class="m-sheet-title" id="m-sheet-title"></div>
      <button class="m-sheet-close" id="m-sheet-close" data-act="mobileCloseSheet" aria-label="Close">&#10005;</button>
    </div>
    <div class="m-sheet-body" id="m-sheet-body"></div>
  </div>

  <div class="m-toast" id="m-toast"></div>

  <!-- MSAL -->
  <script src="js/vendor/msal-browser-5.24.0.min.js" defer></script>
  <!-- Newton core -->
  <script src="js/config.js" defer></script>
  <script src="js/actions.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/ui-kit.js" defer></script>
  <script src="js/headcount.js" defer></script>
  <script src="js/permissions.js" defer></script>
  <script src="js/graph-client.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/diagnostics.js" defer></script>
  <script src="js/api-headcount.js" defer></script>
  <script src="js/analytics.js" defer></script>
  <!-- Mark this session as running the mobile app, so desktop pages
       (index.html etc.) redirect back here after the MSAL login round-trip,
       even when the WebView reports a non-mobile width. -->
  <script src="js/mobile-flag.js"></script>
  <!-- Mobile app -->
  <script src="js/mobile-app.js" defer></script>
  <script src="js/mobile-pages.js" defer></script>
  <script src="js/mobile-home.js" defer></script>
  <script src="js/mobile-people.js" defer></script>
  <script src="js/mobile-roleform.js" defer></script>
  <script src="js/mobile-scorecards.js" defer></script>
  <script src="js/mobile-sales.js" defer></script>
  <script src="js/mobile-analytics.js" defer></script>
  <script src="js/mobile-reporting-ext.js" defer></script>

  <!-- PWA: register the service worker (makes the site installable) -->
  <script src="js/sw-register.js" defer></script>
</body>
</html>
