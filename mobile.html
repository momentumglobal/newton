<!DOCTYPE html>
<html lang="en">
<head>
  <script src="js/diag-buffer.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Newton Mobile</title>
  <link rel="icon" type="image/png" href="momentum-symbol.png">

  <!-- PWA: installable home-screen app -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#090546">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Newton">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root {
          /* ── N-221: tokenised palette — reused desktop names where values match `css/style.css` exactly ── */
          --c-brand: #0A0B44;
          --c-ink: #1a1a2e;
          --c-gray-500: #888;
          --c-gray-600: #666;
          --c-gray-700: #555;
          --c-gray-750: #444;
          --c-gray-800: #333;
          --c-gray-200: #ddd;
          --c-danger: #c0392b;
          --c-danger-alert: #c62828;
          /* mobile-local tokens — no exact desktop match */
          --c-navy-deep: #090546;
          --c-brand-pressed: #12156e;
          --c-border: #e8e8e8;
          --c-divider: #f0f0ee;
          --c-divider-strong: #e0e0de;
          --c-brand-tint: #EBF2FA;
          --c-brand-tint-pressed: #dde8f5;
          --c-input-disabled-bg: #f5f5f5;
          --c-warn-text: #b45309;
          --c-skel-a: #eceae5;
          --c-skel-b: #e0ddd6;
          --c-page-bg: #F5F4F1;
          --c-dot-inactive: #cfcfda;
          --c-dot-pressed: #8f8fb0;
          --c-surface: #fff;
          --shadow-card: rgba(0,0,0,0.06);
          --shadow-card-active: rgba(0,0,0,0.12);
          --shadow-menu: rgba(0,0,0,0.18);
          --scrim: rgba(0,0,0,0.4);
          --c-danger-tint: rgba(192,57,43,0.08);
          --overlay-white-12: rgba(255,255,255,0.12);
          --overlay-white-15: rgba(255,255,255,0.15);
          --overlay-white-18: rgba(255,255,255,0.18);
          --overlay-white-20: rgba(255,255,255,0.2);
          --overlay-white-25: rgba(255,255,255,0.25);
          --overlay-white-30: rgba(255,255,255,0.3);
          --overlay-white-55: rgba(255,255,255,0.55);
        }

    @font-face {
      font-family: 'Polymath';
      src: url('polymath-regular.ttf') format('truetype');
      font-weight: 400;
    }
    @font-face {
      font-family: 'Polymath';
      src: url('polymath-semibold.ttf') format('truetype');
      font-weight: 600;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Polymath', 'Segoe UI', Arial, sans-serif;
      background: var(--c-page-bg);
      color: var(--c-ink);
      font-size: 15px;
      min-height: 100dvh;
    }

    /* ── Login ── */
    #login-screen {
      background: var(--c-navy-deep);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      position: relative;
      overflow: hidden;
    }
    #login-watermark {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 120vmin; height: 120vmin;
      opacity: 0.2;
      pointer-events: none;
    }
    .m-login-logo {
      height: 40px;
      margin-bottom: 40px;
      position: relative;
      z-index: 2;
    }
    .m-login-card {
      background: var(--overlay-white-12);
      border: 1px solid var(--overlay-white-18);
      border-radius: 16px;
      padding: 36px 28px;
      text-align: center;
      width: 100%;
      max-width: 340px;
      position: relative;
      z-index: 2;
    }
    .m-login-card h1 { color: var(--c-surface); font-size: 24px; font-weight: 600; margin-bottom: 8px; }
    .m-login-card p  { color: var(--overlay-white-55); font-size: 14px; margin-bottom: 28px; }
    .btn-signin {
      background: var(--overlay-white-15);
      color: var(--c-surface);
      border: 1px solid var(--overlay-white-30);
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
    }
    .btn-signin:active { background: var(--overlay-white-25); }

    /* ── App shell ── */
    #app-shell { display: none; min-height: 100dvh; flex-direction: column; }

    /* ── Top bar ── */
    .m-topbar {
      background: var(--c-navy-deep);
      color: var(--c-surface);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .m-topbar-title { font-size: 16px; font-weight: 600; }
    .m-topbar-sub   { font-size: 12px; opacity: 0.6; margin-top: 1px; }
    .m-topbar img   { height: 28px; }
    .m-back-btn {
      background: none;
      border: none;
      color: var(--c-surface);
      font-size: 22px;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .m-back-btn:active { background: var(--overlay-white-15); border-radius: 8px; }

    /* ── Main content ── */
    #m-main {
      flex: 1;
      padding: 16px;
      padding-bottom: 80px;
    }

    /* ── Role cards ── */
    .m-role-card {
      background: var(--c-surface);
      border-radius: 12px;
      border: 1px solid var(--c-border);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 3px var(--shadow-card);
      cursor: pointer;
      transition: box-shadow 0.15s;
    }
    .m-role-card:active { box-shadow: 0 2px 8px var(--shadow-card-active); }
    .m-role-title  { font-size: 15px; font-weight: 600; color: var(--c-brand); margin-bottom: 4px; }
    .m-role-meta   { font-size: 13px; color: var(--c-gray-600); margin-bottom: 10px; }
    .m-role-footer { display: flex; align-items: center; justify-content: space-between; }
    .m-stage-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      background: var(--c-brand-tint);
      color: var(--c-brand);
    }
    .m-days-open { font-size: 12px; color: var(--c-gray-500); }
    .m-days-open.warn  { color: var(--c-warn-text); }
    .m-days-open.alert { color: var(--c-danger-alert); }

    /* ── Section header ── */
    .m-section-header {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--c-gray-500);
      margin: 20px 0 10px;
    }
    .m-section-header:first-child { margin-top: 4px; }

    /* ── Role detail ── */
    .m-detail-panel {
      background: var(--c-surface);
      border-radius: 12px;
      border: 1px solid var(--c-border);
      padding: 20px 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 3px var(--shadow-card);
    }
    .m-detail-label { font-size: 12px; color: var(--c-gray-500); margin-bottom: 2px; }
    .m-detail-value { font-size: 15px; font-weight: 600; color: var(--c-brand); margin-bottom: 12px; }
    .m-detail-value:last-child { margin-bottom: 0; }

    /* ── Stage selector ── */
    .m-stage-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .m-stage-btn {
      padding: 12px 8px;
      border-radius: 8px;
      border: 2px solid var(--c-border);
      background: var(--c-surface);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--c-gray-800);
      cursor: pointer;
      text-align: center;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s, background 0.15s;
    }

    .m-stage-btn.active {
      border-color: var(--c-brand);
      background: var(--c-brand-tint);
      color: var(--c-brand);
    }
    .m-stage-btn:active { background: var(--c-brand-tint-pressed); }

    /* ── Action buttons ── */
    .m-action-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }
    .m-btn-primary {
      background: var(--c-brand);
      color: var(--c-surface);
      border: none;
      border-radius: 10px;
      padding: 15px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      text-align: center;
    }
    .m-btn-primary:active { background: var(--c-brand-pressed); }
    .m-btn-primary:disabled { opacity: 0.5; cursor: default; }
    .m-btn-secondary {
      background: var(--c-surface);
      color: var(--c-brand);
      border: 2px solid var(--c-brand);
      border-radius: 10px;
      padding: 13px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      text-align: center;
    }
    .m-btn-secondary:active { background: var(--c-brand-tint); }
    .m-btn-danger {
      background: var(--c-surface);
      color: var(--c-danger);
      border: 2px solid var(--c-danger);
      border-radius: 10px;
      padding: 13px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      text-align: center;
    }
    .m-btn-danger:active { background: var(--c-danger-tint); }

    /* ── Forms ── */
    .m-form-group { margin-bottom: 16px; }
    .m-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--c-gray-750);
      margin-bottom: 6px;
    }
    .m-input, .m-select {
      width: 100%;
      padding: 13px 12px;
      border: 1.5px solid var(--c-gray-200);
      border-radius: 8px;
      font-family: inherit;
      font-size: 15px;
      color: var(--c-ink);
      background: var(--c-surface);
      appearance: none;
      -webkit-appearance: none;
    }
    .m-input:focus, .m-select:focus {
      outline: none;
      border-color: var(--c-brand);
    }
    .m-input[readonly] { background: var(--c-input-disabled-bg); color: var(--c-gray-600); }
    .m-input-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .m-form-error {
      color: var(--c-danger);
      font-size: 13px;
      margin-top: 6px;
      display: none;
    }

    /* ── Bottom nav ── */
    .m-bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--c-surface);
      border-top: 1px solid var(--c-border);
      display: flex;
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .m-nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0 8px;
      cursor: pointer;
      border: none;
      background: none;
      font-family: inherit;
      color: var(--c-gray-500);
      font-size: 11px;
      gap: 3px;
    }
    .m-nav-item.active { color: var(--c-brand); }
    .m-nav-item:active { background: var(--c-brand-tint-pressed); border-radius: 8px; }
    .m-nav-item svg { width: 22px; height: 22px; stroke-width: 2; }

    /* ── Desktop override banner ── */
    .m-desktop-link {
      text-align: center;
      padding: 0;
      font-size: 12px;
      color: var(--c-gray-500);
      background: var(--c-divider);
      border-top: 1px solid var(--c-divider-strong);
    }
    .m-desktop-link a {
      display: block;
      padding: 14px 10px;
      min-height: 44px;
      box-sizing: border-box;
      line-height: 16px;
      color: var(--c-brand);
      text-decoration: underline;
      cursor: pointer;
    }

    /* ── Empty state ── */
    .m-empty {
      text-align: center;
      padding: 48px 24px;
      color: var(--c-gray-500);
      font-size: 14px;
    }
    .m-empty--error { color: var(--c-danger); }
    .m-empty-retry { display: block; margin: 16px auto 0; max-width: 200px; }

    /* ── Skeleton loading shimmer (N-192) ── */
    @keyframes m-skel-sweep {
      0%   { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skel {
      background: linear-gradient(90deg, var(--c-skel-a) 25%, var(--c-skel-b) 37%, var(--c-skel-a) 63%);
      background-size: 200% 100%;
      animation: m-skel-sweep 1.4s ease-in-out infinite;
      border-radius: 6px;
    }
    .skel-list { display: flex; flex-direction: column; gap: 14px; padding: 16px; }
    .skel-list-item { display: flex; align-items: center; gap: 14px; }
    .skel-list-icon { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; }
    .skel-list-line { flex: 1; height: 14px; }
    @media (prefers-reduced-motion: reduce) {
      .skel { animation: none; background: var(--c-skel-b); }
    }

    /* ── Toast ── */
    .m-toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--c-brand);
      color: var(--c-surface);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      z-index: 200;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      white-space: nowrap;
    }
    .m-toast.show { opacity: 1; }

    /* ── Pull-to-refresh (N-200) ── */
    .m-ptr {
      max-height: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: max-height 0.15s ease-out;
    }
    .m-ptr.spinning { transition: max-height 0.2s ease; }
    .m-ptr-spinner {
      width: 22px;
      height: 22px;
      margin: 13px 0;
    }
    .m-ptr.spinning .m-ptr-spinner {
      animation: m-ptr-spin 0.7s linear infinite;
    }
    @keyframes m-ptr-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .m-ptr.spinning .m-ptr-spinner { animation: none; }
    }

    /* ── Module switcher (top bar) ── */
    .m-switcher-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--overlay-white-12);
      border: 1px solid var(--overlay-white-20);
      color: var(--c-surface);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      min-height: 44px;
    }
    .m-switcher-btn:active { background: var(--overlay-white-15); }
    .m-switcher-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: 10px;
      box-shadow: 0 6px 20px var(--shadow-menu);
      overflow: hidden;
      min-width: 180px;
      z-index: 300;
    }
    .m-switcher-item {
      display: flex;
      align-items: center;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      font-family: inherit;
      font-size: 14px;
      color: var(--c-brand);
      padding: 13px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--c-divider);
      min-height: 44px;
      box-sizing: border-box;
    }
    .m-switcher-item:last-child { border-bottom: none; }
    .m-switcher-item.active { background: var(--c-brand-tint); font-weight: 600; }
    .m-switcher-item:active { background: var(--c-brand-tint-pressed); }

    /* ── Home launcher ── */
    .m-home-greeting { margin: 4px 2px 18px; }
    .m-home-hello { font-size: 20px; font-weight: 600; color: var(--c-brand); }
    .m-home-sub   { font-size: 13px; color: var(--c-gray-500); margin-top: 2px; }
    .m-module-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .m-module-card {
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: 14px;
      padding: 22px 16px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 14px;
      cursor: pointer;
      font-family: inherit;
      text-align: left;
      box-shadow: 0 1px 3px var(--shadow-card);
      transition: box-shadow 0.15s, transform 0.1s;
    }
    .m-module-card:active {
      box-shadow: 0 3px 10px var(--shadow-card-active);
      transform: scale(0.98);
    }
    .m-module-icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: var(--c-brand-tint);
      color: var(--c-brand);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .m-module-icon svg { width: 22px; height: 22px; }
    .m-module-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--c-brand);
    }

    /* ── People Scorecards (mobile) ── */
    .m-sc-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    .m-sc-table td { padding: 9px 0; border-bottom: 1px solid var(--c-divider); font-size: 14px; }
    .m-sc-table tr:last-child td { border-bottom: none; }
    .m-sc-metric { color: var(--c-gray-750); }
    .m-sc-val { text-align: right; font-weight: 700; white-space: nowrap; }
    .m-sc-pill {
      color: var(--c-surface);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      letter-spacing: .04em;
    }

    /* Carousel */
    .m-sc-carousel { overflow: hidden; width: 100%; }
    .m-sc-track {
      display: flex;
      transition: transform 0.25s ease;
    }
    .m-sc-slide {
      flex: 0 0 100%;
      min-width: 100%;
      box-sizing: border-box;
    }
    .m-sc-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
    }
    .m-sc-arrow {
      background: var(--c-surface);
      border: 1.5px solid var(--c-brand);
      color: var(--c-brand);
      width: 44px; height: 44px;
      border-radius: 10px;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      flex: 0 0 auto;
    }
    .m-sc-arrow:disabled { opacity: 0.3; cursor: default; }
    .m-sc-arrow:active { background: var(--c-brand-tint); }
    .m-sc-counter {
      flex: 1;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--c-brand);
    }
    .m-sc-dots {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin-top: 12px;
    }
    .m-sc-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      border: none;
      background: var(--c-dot-inactive);
      cursor: pointer;
      padding: 0;
      position: relative;
    }
    .m-sc-dot::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 44px; height: 44px;
    }
    .m-sc-dot.active { background: var(--c-brand); }
    .m-sc-dot:active { background: var(--c-dot-pressed); }
  
/* ── Placement Analytics tiles (mobile) ── */
    .m-an-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 8px;
    }
    .m-an-tile {
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: 12px;
      padding: 14px 14px 12px;
      box-shadow: 0 1px 3px var(--shadow-card);
    }
    .m-an-tile-value {
      font-size: 22px;
      font-weight: 700;
      color: var(--c-brand);
      line-height: 1.1;
    }
    .m-an-tile-label {
      font-size: 12px;
      color: var(--c-gray-700);
      margin-top: 5px;
      font-weight: 600;
    }
    .m-an-tile-sub {
      font-size: 11px;
      color: var(--c-gray-500);
      margin-top: 4px;
    }

    /* ── Phase D: tighten bottom nav for 5 Reporting tabs ── */
    .m-nav-item { font-size: 10px; padding-left: 2px; padding-right: 2px; }
    .m-nav-item svg { width: 20px; height: 20px; }

    /* ── Bottom sheet (N-199) ── */
    .m-sheet-scrim {
      position: fixed; inset: 0;
      background: var(--scrim);
      z-index: 400;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .m-sheet-scrim.open { opacity: 1; pointer-events: auto; }
    .m-sheet {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      max-height: 88dvh;
      background: var(--c-surface);
      border-radius: 16px 16px 0 0;
      box-shadow: 0 -4px 24px var(--shadow-menu);
      z-index: 401;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      pointer-events: none;
      transition: transform 0.25s ease;
    }
    .m-sheet.open { transform: translateY(0); pointer-events: auto; }
    @media (prefers-reduced-motion: reduce) {
      .m-sheet-scrim, .m-sheet { transition: none; }
    }
    .m-sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--c-border);
      flex-shrink: 0;
    }
    .m-sheet-title { font-size: 16px; font-weight: 600; color: var(--c-brand); }
    .m-sheet-close {
      background: none;
      border: none;
      color: var(--c-gray-500);
      font-size: 18px;
      cursor: pointer;
      padding: 0;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .m-sheet-close:active { background: var(--c-divider); border-radius: 8px; }
    .m-sheet-body {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
    }
  </style>
</head>
<body>

  <!-- Login -->
  <div id="login-screen" style="display:none">
    <img id="login-watermark" src="mg-visual-swirl.webp" alt="">
    <img class="m-login-logo" src="momentum-symbol-and-name-global-white.png" alt="Momentum Global">
    <div class="m-login-card">
      <h1>Newton</h1>
      <p>Sign in with your Momentum Global account to continue.</p>
      <button class="btn-signin" onclick="signIn()">Sign in with Microsoft</button>
    </div>
  </div>

  <!-- App shell -->
  <div id="app-shell">
    <div class="m-topbar" id="m-topbar">
      <div style="display:flex;align-items:center;gap:4px">
        <button class="m-back-btn" id="m-back-btn" onclick="mobileBack()" style="display:none">&#8592;</button>
        <div>
          <div class="m-topbar-title" id="m-topbar-title">Newton</div>
          <div class="m-topbar-sub"   id="m-topbar-sub">Momentum Global</div>
        </div>
      </div>
      <div style="position:relative">
        <button class="m-switcher-btn" id="m-switcher-btn" onclick="mobileToggleSwitcher()">
          <span id="m-switcher-label">Newton</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="m-switcher-menu" id="m-switcher-menu" style="display:none"></div>
      </div>
    </div>

    <div class="m-ptr" id="m-ptr" aria-hidden="true">
      <svg class="m-ptr-spinner" viewBox="0 0 24 24" fill="none" stroke="#0A0B44" stroke-width="2.5">
        <path d="M21 12a9 9 0 1 1-3-6.7"/>
        <polyline points="21 3 21 9 15 9"/>
      </svg>
    </div>

    <div id="m-main"></div>

    <nav class="m-bottom-nav" id="m-bottom-nav" style="display:none"></nav>

    <div class="m-desktop-link">
      <a onclick="mobileForceDesktop()">Switch to desktop view</a>
    </div>
  </div>

  <!-- Bottom sheet (N-199) -->
  <div class="m-sheet-scrim" id="m-sheet-scrim"></div>
  <div class="m-sheet" id="m-sheet" role="dialog" aria-modal="true">
    <div class="m-sheet-header">
      <div class="m-sheet-title" id="m-sheet-title"></div>
      <button class="m-sheet-close" id="m-sheet-close" onclick="mobileCloseSheet()" aria-label="Close">&#10005;</button>
    </div>
    <div class="m-sheet-body" id="m-sheet-body"></div>
  </div>

  <div class="m-toast" id="m-toast"></div>

  <!-- MSAL -->
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
  <!-- Newton core -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/diagnostics.js"></script>
  <script src="js/analytics.js"></script>
  <!-- Mark this session as running the mobile app, so desktop pages
       (index.html etc.) redirect back here after the MSAL login round-trip,
       even when the WebView reports a non-mobile width. -->
  <script>
    try { localStorage.setItem('newton_mobile', '1'); } catch (e) {}
  </script>
  <!-- Mobile app -->
  <script src="js/mobile-app.js"></script>
  <script src="js/mobile-pages.js"></script>
  <script src="js/mobile-home.js"></script>
  <script src="js/mobile-people.js"></script>
  <script src="js/mobile-roleform.js"></script>
  <script src="js/mobile-scorecards.js"></script>
  <script src="js/mobile-sales.js"></script>
  <script src="js/mobile-analytics.js"></script>
  <script src="js/mobile-reporting-ext.js"></script>

  <!-- PWA: register the service worker (makes the site installable) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) {
          console.warn('SW registration failed:', e);
        });
      });
    }
  </script>
</body>
</html>
