<!DOCTYPE html>
<html lang="en">
<head>
  <script src="js/diag-buffer.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newton - People</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme-init.js"></script>
  <link rel="icon" type="image/png" href="momentum-symbol.png">
  <!-- Lucide icons -->
  <script src="https://unpkg.com/lucide@1.47.0/dist/umd/lucide.min.js" defer></script>
</head>
<body>

  <!-- Login screen -->
  <div id="login-screen">
    <div class="login-card">
      <h1>Newton — People</h1>
      <p>Sign in with your Momentum Global account to continue.</p>
      <button class="btn-signin" onclick="signIn()">
        Sign in with Microsoft
      </button>
    </div>
  </div>

  <!-- App shell (hidden until signed in) -->
<div id="app-shell">
    <div id="print-header">
      <div>
        <div class="print-header-title" id="print-header-title">Newton</div>
        <div class="print-header-sub" id="print-header-sub">Momentum Global</div>
      </div>
      <img src="momentum-symbol-and-name-global-white.png" alt="Momentum Global">
    </div>
    <div id="sidebar"></div>
    <div id="main-column">
      <div id="breadcrumb-bar"></div>
      <div id="main-content"></div>
    </div>
  </div>

  <!-- MSAL.js -->
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js" defer></script>
  
  <!-- Shared scripts (same files used by Reporting module) -->
  <script src="js/config.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/diagnostics.js" defer></script>

  <!-- People module scripts — load in this order -->
  <script src="js/people-router.js" defer></script>
  <script src="js/nav-core.js" defer></script>
  <script src="js/command-bar.js" defer></script>
  <script src="js/notifications.js" defer></script>
  <script src="js/people-nav.js" defer></script>
  <script src="js/analytics.js" defer></script>
  <script src="js/analytics-pages.js" defer></script>
  <script src="js/list-controls.js" defer></script>
  <script src="js/people-tracker.js" defer></script>
  <script src="js/api-misc.js" defer></script>
  <script src="js/people-payroll.js" defer></script>
  <script src="js/people-dashboard.js" defer></script>
  <script src="js/people-gantt.js" defer></script>
  <script src="js/people-invoices.js" defer></script>
  <script src="js/api-orgchart.js" defer></script>
  <script src="js/org-chart.js" defer></script>
  <script src="js/api-people-forms.js" defer></script>
  <script src="js/people-forms.js" defer></script>
  <script src="js/api-engagement.js" defer></script>
  <script src="js/engagement-pages.js" defer></script>
  <script src="js/engagement-forms.js" defer></script>
  <script src="js/people-app.js" defer></script>

</body>
</html>
